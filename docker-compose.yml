version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - spark-network

  spark-master:
    image: video-upscaling
    hostname: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./data/Normal_Videos_for_Event_Recognition/training/master_videos_old:/opt/spark/data/training
      - ./logs/spark-master:/opt/spark/logs
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - spark-network

  spark-worker-1:
    image: video-upscaling
    hostname: spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_WEBUI_PORT=8081
    ports:
      - "8081:8081"
    depends_on:
      - spark-master
    volumes:
      - ./data/Normal_Videos_for_Event_Recognition/training/worker1_videos_old:/opt/spark/data/training
      - ./logs/spark-worker-1:/opt/spark/logs
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "4"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://spark-master:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - spark-network

  spark-worker-2:
    image: video-upscaling
    hostname: spark-worker-2
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_WEBUI_PORT=8082
    ports:
      - "8082:8081"
    depends_on:
      - spark-master
    volumes:
      - ./data/Normal_Videos_for_Event_Recognition/training/worker2_videos_old:/opt/spark/data/training
      - ./logs/spark-worker-2:/opt/spark/logs
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "4"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://spark-master:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge
